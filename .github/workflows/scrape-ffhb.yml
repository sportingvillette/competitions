name: Scrape FFHB

on:
  schedule:
    # Tous les soirs à ~1h13 du matin heure de Paris. GitHub Actions n'évalue les
    # cron que sur la branche par défaut (main) — ce déclenchement automatique ne
    # démarrera donc qu'une fois ce workflow mergé sur main. Couvre aussi le
    # week-end (les matchs du dimanche sont scrapés dans la nuit de dimanche à
    # lundi, remplace l'ancien cron hebdomadaire du dimanche soir).
    #
    # GitHub Actions n'a pas de notion de fuseau horaire (cron toujours en UTC) :
    # 2 cron, un par saison, pour viser ~1h13 heure de Paris été comme hiver.
    # Découpage par mois entier (pas par date exacte de changement d'heure) : ~1
    # semaine de décalage d'1h autour des 2 transitions annuelles (fin mars, fin
    # octobre), négligeable pour ce cron de rafraîchissement de données.
    #
    # Minute décalée à :13 (pas :00) : GitHub documente que les cron se déclenchant
    # pile à l'heure ronde subissent plus de retard (file d'attente saturée par tous
    # les cron programmés au même instant sur GitHub) — déjà observé en pratique
    # (run programmé à 1h00 UTC démarré avec ~2h30 de retard).
    - cron: "13 0 * 11,12,1,2,3 *"     # nov-mars : 0h13 UTC = ~1h13 CET (hiver, UTC+1)
    - cron: "13 23 * 4,5,6,7,8,9,10 *" # avr-oct : 23h13 UTC = ~1h13 CEST (été, UTC+2)
  workflow_dispatch:
    inputs:
      teams:
        description: "IDs équipes à rafraîchir, séparés par des virgules (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape-ffhb
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Mettre à jour le mapping équipes (nouvelles équipes uniquement)
        run: python scraper/scrape_ffhb_club.py sync-mapping --mapping-dir scraper

      - name: Scraper calendrier/classement
        env:
          # Synchronise chaque match vers la sheet "Matchs" (Web App Apps Script, voir
          # apps-script/Code.gs). No-op silencieux tant que ces secrets ne sont pas définis
          # (Settings > Secrets and variables > Actions).
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_WEBAPP_SECRET: ${{ secrets.SHEET_WEBAPP_SECRET }}
        run: |
          python scraper/scrape_ffhb_club.py scrape \
            --mapping-dir scraper \
            --outdir data \
            --teams "${{ github.event.inputs.teams }}"

      - name: Synchroniser les matchs amicaux saisis à la main dans la sheet Matchs
        # Un match amical (journée="Amical") n'est jamais scrapé depuis FFHB — sans cette
        # étape, il resterait invisible du post Instagram, de la page "Calendrier &
        # résultats" et de la news hebdomadaire, même déjà saisi par Julien dans la sheet.
        # Idempotent (voir sync_amicaux dans scrape_ffhb_club.py) : ne fait rien si rien de
        # nouveau.
        run: python scraper/scrape_ffhb_club.py sync-amicaux --mapping-dir scraper --outdir data

      - name: Sauvegarder un instantané quotidien du classement (historique)
        # Nécessaire pour calculer l'évolution du classement (+1/-1) dans la future news hebdo
        # "résultats du week-end" (site SportsRégions) : classements_club.csv est écrasé chaque
        # nuit, sans ça impossible de savoir "où en était l'équipe avant ce week-end". Un
        # fichier par jour calendaire (heure de Paris, PAS UTC — le cron d'été tourne à 23h13
        # UTC = ~1h13 CEST le lendemain, un `date -u` daterait le fichier de la veille) ; la
        # génération de la news choisira le dernier instantané antérieur au samedi du week-end
        # concerné (pas forcément exactement le vendredi, ex. si un run a échoué).
        run: |
          mkdir -p data/classements_history
          today=$(TZ=Europe/Paris date +%Y-%m-%d)
          cp data/classements_club.csv "data/classements_history/${today}.csv"

      - name: Committer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scraper/team_mapping.csv
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "chore: mise à jour automatique FFHB ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Notifier les anomalies détectées (sans faire échouer le run)
        # Le scraper (voir scrape_ffhb_club.py) n'échoue plus jamais volontairement sur ces
        # signaux (equipes_sans_match / equipes_rafraichies_sans_nouveau_match /
        # matchs_a_verifier / erreurs) : un exit non-zéro sautait les étapes suivantes,
        # notamment le commit — une seule équipe cassée perdait alors les données fraîches de
        # TOUTES les autres équipes du même run (vécu le 2026-09-18). Demande de Julien : ne
        # jamais bloquer l'exécution, mais toujours pouvoir identifier et corriger le problème
        # avant que la tâche hebdo (news/post Instagram) ne tourne sur des données cassées.
        # Notification via une issue GitHub (créée une seule fois, puis commentée à chaque run
        # tant qu'elle reste ouverte — pas une nouvelle issue par nuit) : Julien reçoit déjà un
        # e-mail GitHub à chaque commentaire/création d'issue sur ses repos, même mécanisme que
        # celui qui l'a alerté de l'échec du run du 2026-09-18, mais qui ne bloque plus rien.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          LABEL = "scraper-ffhb-alerte"
          TITLE = "Anomalies scraper FFHB à vérifier"

          if not os.path.exists("data/last_update.json"):
              print("Pas de last_update.json (le scraper a probablement crashé avant de l'écrire) — rien à faire ici.")
              raise SystemExit(0)

          with open("data/last_update.json", encoding="utf-8") as f:
              status = json.load(f)

          sections = [
              ("Erreurs de scraping (exception Python)", status.get("erreurs") or []),
              ("Équipes avec un lien FFHB mais 0 match jamais récupéré", status.get("equipes_sans_match") or []),
              ("Équipes rafraîchies ce run mais 0 match frais (mapping probablement cassé)", status.get("equipes_rafraichies_sans_nouveau_match") or []),
              ("Matchs non confirmés à moins de 7 jours (ou déjà passés)", status.get("matchs_a_verifier") or []),
          ]
          problems = [(title, items) for title, items in sections if items]

          subprocess.run(
              ["gh", "label", "create", LABEL, "--color", "d73a4a",
               "--description", "Anomalie détectée par le scraper FFHB"],
              capture_output=True,
          )  # ignore l'erreur si le label existe déjà (pas de --force pour ne pas écraser une éventuelle édition manuelle)

          existing = subprocess.run(
              ["gh", "issue", "list", "--label", LABEL, "--state", "open", "--json", "number", "--jq", ".[0].number"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          if not problems:
              if existing:
                  subprocess.run(
                      ["gh", "issue", "close", existing, "--comment",
                       "Plus aucune anomalie détectée sur le dernier run — fermeture automatique."],
                      check=True,
                  )
                  print(f"Issue #{existing} refermée (anomalies résolues).")
              else:
                  print("Aucune anomalie, rien à signaler.")
              raise SystemExit(0)

          lines = [f"Détecté le {status.get('derniere_maj', '?')} (run {status.get('mode', '?')})." , ""]
          for title, items in problems:
              lines.append(f"**{title}** ({len(items)}) :")
              lines.extend(f"- {item}" for item in items)
              lines.append("")
          lines.append('Voir CLAUDE.md (section "club porteur") pour la marche à suivre habituelle.')
          body = "\n".join(lines)

          if existing:
              subprocess.run(["gh", "issue", "comment", existing, "--body", body], check=True)
              print(f"Commentaire ajouté sur l'issue #{existing}.")
          else:
              subprocess.run(
                  ["gh", "issue", "create", "--title", TITLE, "--label", LABEL, "--body", body],
                  check=True,
              )
              print("Nouvelle issue créée.")
          PY
